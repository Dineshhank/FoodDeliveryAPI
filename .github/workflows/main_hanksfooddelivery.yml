name: Build and deploy ASP.Net Core app to Azure Web App - HanksFooddelivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore
      - name: Restore dependencies
        run: dotnet restore

      # Build
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # ✅ FIXED: publish ONLY API project
      - name: Publish
        run: dotnet publish FoodDelivery.API/FoodDelivery.API.csproj -c Release -o ./publish

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_44B5AA95DF77472ABBB9492D0BC29750 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_50594553A7704B5C900CF0D584AB14CF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DDE8DB636DB843A08836CB1E62324B3A }}

      # ✅ FIXED: deploy correct folder
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'HanksFooddelivery'
          slot-name: 'Production'
          package: .

name: Build and deploy ASP.Net Core app to Azure Web App - HanksFoodDelivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ./FoodDelivery.API/FoodDelivery.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_835DB8DA53DE439B876BFBADA79E177B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FDA47B460F3D4FB6993DE3EC4E7FBDAD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7A0A3DC60BF64D43AC0F00023D6C4834 }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'HanksFoodDelivery'
          slot-name: 'Production'
          package: .
